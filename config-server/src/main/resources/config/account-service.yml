server:
  port: 8082

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:5432/account_db
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/bank/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: account-service-group
      properties:
        spring.json.trusted.packages: "*"

# Card keys, at least 16 characters each. There are no defaults: the service does not start
# without them (docker-compose.yml and k8s/kustomization.yaml set development values).
# - cvv-secret derives the card security code (CardSecurityCode): changing it invalidates the cvv
#   of every issued card.
# - pan-secret hashes the card numbers (CardNumberHash): changing it makes every card unfindable.
card:
  cvv-secret: ${CARD_CVV_SECRET}
  pan-secret: ${CARD_PAN_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "*"

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
        fetch-registry: true
        register-with-eureka: true
    instance:
        prefer-ip-address: true
