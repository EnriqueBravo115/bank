server:
  port: 8081

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:5432/transaction_db
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/bank/protocol/openid-connect/certs
      # transaction-service's own token (client credentials, role SERVICE) to call account-service
      client:
        registration:
          account-service:
            provider: keycloak
            client-id: transaction-service
            client-secret: transaction-service-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/bank/protocol/openid-connect/token
  # Without explicit timeouts Feign waits up to 60 s. Past readTimeout the outcome is unknown and
  # the transaction stays PENDING; the reconciler sends it again with the same idempotency key.
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 2000
            readTimeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# The @CircuitBreaker annotations on AccountClient use this instance. When it is open, or
# account-service answers with an error, the fallback (AccountClient.toResult) settles the
# transaction as DECLINED/FAILED, or leaves it PENDING when the outcome is unknown.
resilience4j:
  circuitbreaker:
    instances:
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        # Business rejections (frozen account, insufficient funds, unknown account) and a duplicate
        # in-flight key are not account-service failures; they still reach the fallback.
        ignoreExceptions:
          - feign.FeignException$UnprocessableEntity
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict

# PENDING transactions (unknown outcome) are sent again with the same idempotency key.
transaction:
  reconciliation:
    interval: PT5S

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # Buckets for the latency percentiles of the Grafana dashboard (histogram_quantile)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    dev.enrique.bank: DEBUG
    feign: DEBUG

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
        fetch-registry: true
        register-with-eureka: true
    instance:
        prefer-ip-address: true
