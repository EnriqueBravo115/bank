server:
  port: 8081

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:5432/transaction_db
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/bank/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# The @CircuitBreaker annotations on AccountClient use this instance; when it is open, or
# account-service answers with an error, AccountClient.movementFallback records the transaction
# as DECLINED/FAILED instead of failing the request.
resilience4j:
  circuitbreaker:
    instances:
      account-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        slidingWindowType: COUNT_BASED
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        eventConsumerBufferSize: 10
        # Business rejections (frozen account, insufficient funds, unknown account) are not
        # account-service failures; they still reach the fallback, which records them as DECLINED/FAILED.
        ignoreExceptions:
          - feign.FeignException$UnprocessableEntity
          - feign.FeignException$NotFound

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    dev.enrique.bank: DEBUG
    feign: DEBUG

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
        fetch-registry: true
        register-with-eureka: true
    instance:
        prefer-ip-address: true
