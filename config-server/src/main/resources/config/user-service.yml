server:
  port: 8080

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DATASOURCE_HOST:localhost}:5432/user_db
    username: user
    password: password
    driverClassName: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://${KEYCLOAK_HOST:localhost}:8080/realms/bank/protocol/openid-connect/certs
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        # Fail fast when the broker is down: the outbox publisher retries on its next run.
        max.block.ms: 5000
        # The producer gives up on a record before the outbox stops waiting for it (EventOutbox,
        # 10 s): a send counted as failed is dropped from the producer's buffer instead of being
        # delivered later, behind the outbox's back (e.g. an event already FAILED reaching Kafka).
        # It must be >= linger.ms + request.timeout.ms.
        request.timeout.ms: 4000
        delivery.timeout.ms: 9000
    consumer:
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: user-service-group
      properties:
        spring.json.trusted.packages: "*"

keycloak:
  auth-server-url: http://${KEYCLOAK_HOST:localhost}:8080
  realm: bank
  client-id: kong
  client-secret: kong-client-secret

management:
  endpoints:
    web:
      exposure:
        include: "*"
  # /actuator/health/liveness and /readiness for the Kubernetes probes. Liveness does not include the
  # database, Kafka or the circuit breaker: a dependency that is down must not get the pod restarted.
  endpoint:
    health:
      probes:
        enabled: true
  # Buckets for the latency percentiles of the Grafana dashboard (histogram_quantile)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

eureka:
    client:
        service-url:
            defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka
        fetch-registry: true
        register-with-eureka: true
    instance:
        prefer-ip-address: true
