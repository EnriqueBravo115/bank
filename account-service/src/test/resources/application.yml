# Overrides src/main/resources/application.yml in tests: no Config Server, no Eureka, no Kafka consumers.
spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:0
    consumer:
      group-id: account-service-test
    listener:
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never called: tests authenticate with spring-security-test's jwt()
          jwk-set-uri: http://localhost/realms/bank/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
