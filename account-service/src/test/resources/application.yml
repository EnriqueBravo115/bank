# Overrides src/main/resources/application.yml in tests: no Config Server, no Eureka, and the Kafka
# consumers only start in UserConsumerTest (embedded broker).
spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:0
    consumer:
      group-id: account-service-test
      # Same deserialization as config-server's account-service.yml
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    listener:
      auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never called: tests authenticate with spring-security-test's jwt()
          jwk-set-uri: http://localhost/realms/bank/protocol/openid-connect/certs

eureka:
  client:
    enabled: false
