# Manifests deployed by Argo CD (gitops/argocd/application.yaml): the base in k8s/ with the images
# published by CI to GHCR instead of the local bank/<service>:1.0.0 images loaded with kind load.
# The tag is the full commit SHA of an image set that passed CI (sha-<commit>).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s

images:
  - name: bank/eureka-server
    newName: ghcr.io/enriquebravo115/bank-eureka-server
    newTag: sha-34aa2fd4bcf3bcabc077e5ea4685c656fab15f41
  - name: bank/config-server
    newName: ghcr.io/enriquebravo115/bank-config-server
    newTag: sha-34aa2fd4bcf3bcabc077e5ea4685c656fab15f41
  - name: bank/user-service
    newName: ghcr.io/enriquebravo115/bank-user-service
    newTag: sha-34aa2fd4bcf3bcabc077e5ea4685c656fab15f41
  - name: bank/account-service
    newName: ghcr.io/enriquebravo115/bank-account-service
    newTag: sha-34aa2fd4bcf3bcabc077e5ea4685c656fab15f41
  - name: bank/transaction-service
    newName: ghcr.io/enriquebravo115/bank-transaction-service
    newTag: sha-34aa2fd4bcf3bcabc077e5ea4685c656fab15f41
