spring:
  cloud:
    config:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9090/realms/bank/protocol/openid-connect/certs

keycloak:
  realm: bank
  client-id: kong
  client-secret: kong-client-secret
  auth-server-url: http://localhost:9090/placeholder

eureka:
  client:
    enabled: false