# Overrides src/main/resources/application.yml in tests: no Config Server, no Eureka.
spring:
  application:
    name: transaction-service
  cloud:
    config:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never called: tests authenticate with spring-security-test's jwt()
          jwk-set-uri: http://localhost/realms/bank/protocol/openid-connect/certs
      client:
        registration:
          account-service:
            provider: keycloak
            client-id: transaction-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            # Never called: tests replace ServiceTokenProvider or AccountClient
            token-uri: http://localhost/realms/bank/protocol/openid-connect/token

eureka:
  client:
    enabled: false

# Tests call TransactionSettlement.retryPending themselves.
transaction:
  reconciliation:
    enabled: false
