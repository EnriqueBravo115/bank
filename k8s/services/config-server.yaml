apiVersion: v1
kind: Service
metadata:
  name: config-server
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-eureka-server
          image: busybox:1.36
          command: ["sh", "-c", "until wget -q -O /dev/null http://eureka-server:8761/actuator/health; do echo waiting for eureka-server:8761/actuator/health; sleep 3; done"]
      containers:
        - name: config-server
          image: bank/config-server:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          env:
            - name: EUREKA_HOST
              value: "eureka-server"
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
