# Kong runs DB-less: routes are loaded from kong.yml (ConfigMap) at startup,
# replacing the kong-db + kong-migration + kong-deck setup used in docker-compose.
apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
spec:
  type: NodePort
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
      nodePort: 30000
---
apiVersion: v1
kind: Service
metadata:
  name: kong-admin
spec:
  selector:
    app: kong
  ports:
    - name: admin
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
    spec:
      # Avoid injected KONG_* service-link vars being read as Kong settings
      enableServiceLinks: false
      containers:
        - name: kong
          image: kong:3.6
          ports:
            - containerPort: 8000
            - containerPort: 8001
            - containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: 0.0.0.0:8000
            - name: KONG_ADMIN_LISTEN
              value: 0.0.0.0:8001
            - name: KONG_STATUS_LISTEN
              value: 0.0.0.0:8100
            - name: KONG_PLUGINS
              value: bundled
            # Default "auto" starts one worker per host CPU and exceeds the memory limit
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
          readinessProbe:
            httpGet:
              path: /status/ready
              port: 8100
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8100
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /kong
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kong-declarative-config
