apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bank

resources:
  - namespace.yaml
  - databases/user-db.yaml
  - databases/transaction-db.yaml
  - databases/account-db.yaml
  - databases/keycloak-db.yaml
  - kafka/broker.yaml
  - kafka/kafka-ui.yaml
  - keycloak/keycloak.yaml
  - mailpit/mailpit.yaml
  - kong/kong.yaml
  - services/eureka-server.yaml
  - services/config-server.yaml
  - services/user-service.yaml
  - services/transaction-service.yaml
  - services/account-service.yaml
  - monitoring/prometheus.yaml
  - monitoring/grafana.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - keycloak/realm-export.json
  - name: kong-declarative-config
    files:
      - kong/kong.yml
  - name: prometheus-config
    files:
      - monitoring/prometheus.yml
  - name: grafana-datasources
    files:
      - monitoring/grafana/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - monitoring/grafana/dashboards.yml
  - name: grafana-dashboards
    files:
      - monitoring/grafana/dashboards/bank-services.json

secretGenerator:
  - name: postgres-credentials
    literals:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
  - name: keycloak-admin
    literals:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
