apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bank

resources:
  - namespace.yaml
  - databases/user-db.yaml
  - databases/transaction-db.yaml
  - databases/account-db.yaml
  - databases/keycloak-db.yaml
  - kafka/broker.yaml
  - kafka/kafka-ui.yaml
  - keycloak/keycloak.yaml
  - mailpit/mailpit.yaml
  - kong/kong.yaml
  - services/eureka-server.yaml
  - services/config-server.yaml
  - services/user-service.yaml
  - services/transaction-service.yaml
  - services/account-service.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - keycloak/realm-export.json
  - name: kong-declarative-config
    files:
      - kong/kong.yml

secretGenerator:
  - name: postgres-credentials
    literals:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
  - name: keycloak-admin
    literals:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
  # Card keys of account-service (development values: replace them outside the local cluster)
  - name: account-service-card-keys
    literals:
      - CARD_CVV_SECRET=local-dev-card-cvv-secret
      - CARD_PAN_SECRET=local-dev-card-pan-secret
